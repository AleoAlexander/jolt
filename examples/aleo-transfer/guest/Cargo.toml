[package]
name = "aleo-transfer-guest"
version = "0.1.0"
edition = "2021"

[features]
guest = []
field-inline = ["jolt/field-inline"]

[dependencies]
jolt = { package = "jolt-sdk", path = "../../../jolt-sdk" }
jolt-inlines-edwards-bls12.workspace = true
ark-ed-on-bls12-377 = { version = "0.5.0", default-features = false }
ark-ec = { version = "0.5.0", default-features = false }
ark-ff = { version = "0.5.0", default-features = false }

[lib]
test = false
doctest = false
bench = false

[[bin]]
name = "aleo-transfer-guest"
path = "src/main.rs"
test = false
bench = false
