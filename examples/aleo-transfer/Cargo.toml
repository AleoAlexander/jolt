[package]
name = "aleo-transfer"
version = "0.1.0"
edition = "2021"

[dependencies]
jolt-sdk = { workspace = true, features = ["host"] }
tracing.workspace = true
tracing-subscriber.workspace = true
guest = { package = "aleo-transfer-guest", path = "./guest" }

[dev-dependencies]
serde_json = "1"
ark-ed-on-bls12-377 = { version = "0.5.0", default-features = false }
ark-ff = { version = "0.5.0", default-features = false }
